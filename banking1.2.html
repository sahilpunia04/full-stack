<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Banking Interface</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .bank-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
        }

        button {
            width: 48%;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }

        .deposit {
            background-color: #1e5bff;
        }

        .withdraw {
            background-color: #ff3b3b;
        }

        .message {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }

        @media (max-width: 400px) {
            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>

<div class="bank-container">
    <h1>Balance: $<span id="balance">1000</span></h1>

    <label for="amount">Amount</label>
    <input type="number" id="amount" placeholder="Enter amount">

    <div class="buttons">
        <button class="deposit" onclick="deposit()">Deposit</button>
        <button class="withdraw" onclick="withdraw()">Withdraw</button>
    </div>

    <div id="message" class="message"></div>
</div>

<script>
    let balance = 1000;

    function deposit() {
        const amount = Number(document.getElementById("amount").value);
        const message = document.getElementById("message");

        if (amount <= 0) {
            message.textContent = "Invalid amount!";
            message.className = "message error";
            return;
        }

        balance += amount;
        updateUI("Deposit successful!", "success");
    }

    function withdraw() {
        const amount = Number(document.getElementById("amount").value);
        const message = document.getElementById("message");

        if (amount <= 0) {
            message.textContent = "Invalid amount!";
            message.className = "message error";
            return;
        }

        if (amount > balance) {
            message.textContent = "Insufficient balance!";
            message.className = "message error";
            return;
        }

        balance -= amount;
        updateUI("Withdrawal successful!", "success");
    }

    function updateUI(text, type) {
        document.getElementById("balance").textContent = balance;
        document.getElementById("message").textContent = text;
        document.getElementById("message").className = "message " + type;
        document.getElementById("amount").value = "";
    }
</script>

</body>
</html>
